<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sephimandev — Legal</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#fdfdfc;
    --fg:#1a1a1a;
    --muted:#5f6368;
    --rule:#d9d9d6;
    --accent:#3b4ccc;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#15161a;
      --fg:#e6e6e3;
      --muted:#9aa0a6;
      --rule:#33353b;
      --accent:#93a2ff;
    }
  }
  html{-webkit-text-size-adjust:100%}
  body{max-width:68ch;margin:4rem auto;padding:0 1.25rem;background:var(--bg);color:var(--fg);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.65}
  h1{font-size:1.9rem;line-height:1.2;letter-spacing:-.02em;text-wrap:balance;margin:0 0 .6rem}
  p{text-wrap:pretty}
  a{color:var(--accent);text-underline-offset:.15em}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
  .wordmark{margin:0 0 .5rem;font-size:.78rem;font-weight:600;letter-spacing:.16em;
            text-transform:uppercase;color:var(--muted)}
  .lede{margin:0 0 2.5rem;color:var(--muted)}
  .docs{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  .docs li{border-bottom:1px solid var(--rule)}
  .docs a{display:block;padding:1rem .15rem;font-weight:500;text-decoration:none}
  .docs a:hover{text-decoration:underline}
  .docs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:2px}
  @media (max-width:36rem){
    body{font-size:1.125rem;margin:2.5rem auto;padding:0 1.1rem}
    h1{font-size:1.6rem}
  }
</style>
</head>
<body>

<header>
  <p class="wordmark">Sephimandev</p>
  <h1>Legal</h1>
  <p class="lede">Legal documents for Sephimandev apps.</p>
</header>

<ul class="docs">
  <li><a href="fastkeep/privacy.html">Fastkeep — Privacy Policy</a> / <a href="fastkeep/privacy-es.html"><span lang="es">Política de privacidad</span></a></li>
  <li><a href="tradeschool/privacy.html">TradeSchool — Privacy Policy</a> / <a href="tradeschool/privacy-es.html"><span lang="es">Política de privacidad</span></a></li>
</ul>

</body>
</html>
